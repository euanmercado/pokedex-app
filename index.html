<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéDex Unit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E3350D%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="unit">

  <!-- Top bar: lights + title -->
  <header class="unit__top">
    <div class="lights">
      <span class="lens" aria-hidden="true"></span>
      <span class="bulb bulb--red" aria-hidden="true"></span>
      <span class="bulb bulb--yellow" aria-hidden="true"></span>
      <span class="bulb bulb--green" aria-hidden="true"></span>
    </div>
    <h1 class="unit__title">PokéDex<span class="unit__title-sub">field unit</span></h1>
  </header>

  <!-- Controls -->
  <section class="unit__controls" aria-label="Search and filter">
    <form id="search-form" class="control control--search" autocomplete="off">
      <label for="search-input" class="control__label">Lookup</label>
      <input id="search-input" type="text" placeholder="Name or number, e.g. pikachu or 25" />
      <button type="submit" class="btn btn--go" aria-label="Search">GO</button>
    </form>

    <div class="control control--filter">
      <label for="type-select" class="control__label">Type</label>
      <select id="type-select">
        <option value="">All types</option>
      </select>
    </div>

    <button id="reset-btn" class="btn btn--reset" type="button">Reset</button>
  </section>

  <!-- Screen -->
  <main class="screen" id="screen" aria-live="polite">
    <p class="screen__status" id="status">Booting Pokédex&hellip;</p>
    <div class="grid" id="grid"></div>
    <div class="loadmore-wrap">
      <button id="load-more" class="btn btn--loadmore" hidden>Scan next batch</button>
    </div>
  </main>

  <footer class="unit__foot">
    <span>Data: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></span>
    <span class="unit__foot-dot" aria-hidden="true"></span>
    <span id="count-label">&nbsp;</span>
  </footer>
</div>

<!-- Detail modal -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <button id="modal-close" class="modal__close" aria-label="Close">&times;</button>
    <div id="modal-body" class="modal__body">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
